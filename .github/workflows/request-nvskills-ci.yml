name: Request NVSkills CI

# Asks NVIDIA/nvskills-ci to evaluate and sign the skills under skills/ for a
# pull request. Runs are requested explicitly: a maintainer comments
# `/nvskills-ci` on the PR. The push trigger only re-verifies after the NVSkills
# bot pushes its signature commit. There is deliberately no pull_request
# trigger; official evaluation runs are expensive and rewrite the branch, so
# they are started by hand when a skill revision is ready to be signed.
#
# Source: NVIDIA/nvskills-ci templates/team-request-workflow.yml, with the
# pull_request trigger removed.

on:
  issue_comment:
    types: [created]
  push:

jobs:
  request:
    if: >
      (github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        startsWith(github.event.comment.body, '/nvskills-ci')) ||
      (github.event_name == 'push' &&
        github.actor == (vars.NVSKILLS_SIGNATURE_PUSH_ACTOR || 'nv-skills-ci[bot]') &&
        startsWith(github.event.head_commit.message, vars.NVSKILLS_SIGNATURE_COMMIT_TITLE || 'Attach NVSkills validation signatures'))
    permissions:
      contents: read
      pull-requests: read
      statuses: read
    uses: NVIDIA/skills/.github/workflows/team-request.yml@main
    secrets:
      NVSKILLS_CI_DISPATCH_TOKEN: ${{ secrets.NVSKILLS_CI_DISPATCH_TOKEN }}
