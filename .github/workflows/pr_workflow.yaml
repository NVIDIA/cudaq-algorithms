name: PR workflow

on:
  push:
    branches:
      - "pull-request/[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: write
  contents: read
  pull-requests: read

jobs:
  check-changes:
    name: Check changes
    runs-on: ubuntu-latest
    outputs:
      build-cudaq: ${{ steps.filter.outputs.build-cudaq }}
      build-algorithms: ${{ steps.filter.outputs.build-algorithms }}
      build-examples: ${{ steps.filter.outputs.build-examples }}
      build-wheels: ${{ steps.filter.outputs.build-wheels }}
      pr-number: ${{ steps.export-pr-info.outputs.pr_number }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Lookup PR info
        id: get-pr-info
        env:
          GH_TOKEN: ${{ github.token }}
        uses: nv-gha-runners/get-pr-info@main

      - name: Export PR info
        id: export-pr-info
        run: |
          echo "pr_number=${{ fromJSON(steps.get-pr-info.outputs.pr-info).number }}" >> $GITHUB_OUTPUT

      - name: Check what needs testing
        uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ fromJSON(steps.get-pr-info.outputs.pr-info).base.ref }}
          filters: |
            build-cudaq:
              - '.github/actions/get-cudaq-build/**'
              - '.github/actions/get-cudaq-version/**'
              - '.cudaq_version'
            build-algorithms:
              - '.github/workflows/lib_algorithms.yaml'
              - '.github/workflows/pr_workflow.yaml'
              - 'CMakeLists.txt'
              - 'cmake/**'
              - 'include/**'
              - 'lib/**'
              - 'python/**'
              - 'tests/**'
              - 'scripts/test_algorithms_build.sh'
              - 'scripts/validation/**'
              - 'pyproject.toml.cu*'
            build-examples:
              - 'examples/**'
            build-wheels:
              - '.github/actions/get-cudaq-wheels/**'
              - '.github/workflows/wheel_algorithms.yaml'
              - '.github/workflows/scripts/**'
              - 'scripts/ci/**'
              - 'python/metapackages/**'
              - 'pyproject.toml.cu*'
              - '.cudaq_version'

  build-cudaq:
    name: Build CUDA-Q
    needs: [check-changes]
    if: needs.check-changes.outputs.build-cudaq == 'true'
    strategy:
      fail-fast: false
      matrix:
        platform: ['amd64', 'arm64']
        cuda_version: ['12.6', '13.0']
    runs-on: ${{ startsWith(github.repository, 'NVIDIA/cudaq-algorithms') && format('linux-{0}-cpu32', matrix.platform) || 'ubuntu-latest' }}
    container: ghcr.io/nvidia/cuda-quantum-devcontainer:${{ matrix.platform }}-cu${{ matrix.cuda_version }}-gcc12-main
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Configure
        id: config
        run: |
          cuda_major=$(echo ${{ matrix.cuda_version }} | cut -d . -f1)
          echo "cuda_major=$cuda_major" >> $GITHUB_OUTPUT

      - name: Get required CUDAQ version
        id: get-cudaq-version
        uses: ./.github/actions/get-cudaq-version

      - name: Get CUDAQ build
        uses: ./.github/actions/get-cudaq-build
        with:
          repo: ${{ steps.get-cudaq-version.outputs.repo }}
          ref: ${{ steps.get-cudaq-version.outputs.ref }}
          token: ${{ secrets.CUDAQ_ACCESS_TOKEN }}
          cache-key-suffix: pr${{ needs.check-changes.outputs.pr-number }}
          save-build: true
          save-ccache: false
          platform: ${{ matrix.platform }}-cu${{ steps.config.outputs.cuda_major }}

  build-algorithms:
    name: Algorithms
    needs: [check-changes]
    if: |
      always() &&
      !cancelled() &&
      needs.check-changes.result == 'success' &&
      (
        needs.check-changes.outputs.build-algorithms == 'true' ||
        needs.check-changes.outputs.build-cudaq == 'true' ||
        needs.check-changes.outputs.build-examples == 'true'
      )
    strategy:
      fail-fast: false
      matrix:
        platform: ["amd64", "arm64"]
        cuda_version: ['12.6', '13.0']
    runs-on: ${{ startsWith(github.repository, 'NVIDIA/cudaq-algorithms') && format('linux-{0}-cpu8', matrix.platform) || 'ubuntu-latest' }}
    container: ghcr.io/nvidia/cuda-quantum-devcontainer:${{ matrix.platform }}-cu${{ matrix.cuda_version }}-gcc12-main
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Configure
        id: config
        run: |
          cuda_major=$(echo ${{ matrix.cuda_version }} | cut -d . -f1)
          echo "cuda_major=$cuda_major" >> "$GITHUB_OUTPUT"

      - name: Get required CUDAQ version
        id: get-cudaq-version
        uses: ./.github/actions/get-cudaq-version

      - name: Get CUDAQ build
        uses: ./.github/actions/get-cudaq-build
        with:
          repo: ${{ steps.get-cudaq-version.outputs.repo }}
          ref: ${{ steps.get-cudaq-version.outputs.ref }}
          token: ${{ secrets.CUDAQ_ACCESS_TOKEN }}
          cache-key-suffix: pr${{ needs.check-changes.outputs.pr-number }}
          save-build: false
          save-ccache: false
          platform: ${{ matrix.platform }}-cu${{ steps.config.outputs.cuda_major }}

      - name: Install build requirements
        run: |
          apt update
          apt install -y --no-install-recommends build-essential
          python3 -m pip install cmake ninja nanobind numpy pytest

      - name: Build and run tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          export PATH=/cudaq-install/bin:$PATH
          export LD_LIBRARY_PATH=/cudaq-install/lib:${LD_LIBRARY_PATH:-}
          bash scripts/test_algorithms_build.sh \
            --build-dir build \
            --cudaq-prefix /cudaq-install \
            --cudaq-dir /cudaq-install/lib/cmake/cudaq

  build-wheels:
    name: Wheels
    needs: [check-changes]
    if: |
      !failure() && !cancelled() &&
      needs.check-changes.outputs.build-wheels == 'true'
    uses: ./.github/workflows/wheel_algorithms.yaml
    permissions:
      actions: write
      contents: read
      pull-requests: read
    with:
      build_type: Release
      cache_key_suffix: pr${{ needs.check-changes.outputs.pr-number }}
    secrets:
      CUDAQ_ACCESS_TOKEN: ${{ secrets.CUDAQ_ACCESS_TOKEN }}

  verify:
    name: Verify PR
    if: ${{ always() }}
    needs:
      - check-changes
      - build-cudaq
      - build-algorithms
      - build-wheels
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          status="success"

          check_result() {
            name=$1
            result=$2

            # Skipped jobs are expected when the path filter does not match.
            if [[ "$result" == "failure" || "$result" == "cancelled" ]]; then
              echo "$name job failed"
              status="failed"
            fi
          }

          check_result "check-changes"    "${{ needs.check-changes.result }}"
          check_result "build-cudaq"      "${{ needs.build-cudaq.result }}"
          check_result "build-algorithms" "${{ needs.build-algorithms.result }}"
          check_result "build-wheels"     "${{ needs.build-wheels.result }}"

          if [[ "$status" != "success" ]]; then
            exit 1
          fi
