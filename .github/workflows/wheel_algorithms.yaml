name: Algorithms wheels

on:
  workflow_dispatch:
    inputs:
      build_type:
        type: choice
        required: true
        description: Build type.
        default: Release
        options:
          - Release
          - Debug
      version:
        type: string
        description: Version number to create wheels with.
        default: 0.14.99
        required: false
      cache_key_suffix:
        type: string
        description: Optional suffix to append to CUDA-Q wheel cache keys.
        default: ''
        required: false
      cudaq_repo:
        type: string
        description: Optional CUDA-Q repository override.
        default: ''
        required: false
      cudaq_ref:
        type: string
        description: Optional CUDA-Q ref override.
        default: ''
        required: false
  workflow_call:
    inputs:
      build_type:
        type: string
        default: Release
        required: false
      version:
        type: string
        default: 0.14.99
        required: false
      cache_key_suffix:
        type: string
        default: ''
        required: false
      cudaq_repo:
        type: string
        default: ''
        required: false
      cudaq_ref:
        type: string
        default: ''
        required: false
    secrets:
      CUDAQ_ACCESS_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-build-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cudaq-wheels:
    name: Build CUDA-Q wheels
    # Building CUDA-Q from source needs the large self-hosted runners;
    # forks skip it (and the test job below) and still get the pure
    # algorithms wheels + metapackages artifacts.
    if: startsWith(github.repository, 'NVIDIA/cudaq-algorithms')
    uses: ./.github/workflows/build_cudaq_wheels.yaml
    permissions:
      actions: write
      contents: read
      pull-requests: read
    with:
      cache_key_suffix: ${{ inputs.cache_key_suffix }}
      cudaq_repo: ${{ inputs.cudaq_repo }}
      cudaq_ref: ${{ inputs.cudaq_ref }}
      save_build: true
      upload_artifact: true
    secrets:
      CUDAQ_ACCESS_TOKEN: ${{ secrets.CUDAQ_ACCESS_TOKEN }}

  build-algorithms-wheels:
    name: Build CUDA-Q Algorithms wheels
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12']
        platform: ['amd64']
        cuda_version: ['12.6']
    runs-on: ${{ startsWith(github.repository, 'NVIDIA/cudaq-algorithms') && format('linux-{0}-cpu8', matrix.platform) || 'ubuntu-latest' }}
    # The wheels are pure Python (py3-none-any): no CUDA-Q toolchain, no
    # manylinux devdeps image — a stock python container is enough.
    container: python:${{ matrix.python }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Configure
        id: config
        run: |
          cuda_major=$(echo ${{ matrix.cuda_version }} | cut -d . -f1)
          echo "cuda_major=$cuda_major" >> "$GITHUB_OUTPUT"

      - name: Build CUDA-Q Algorithms wheels
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/ci/build_wheels.sh \
            --cuda-version ${{ steps.config.outputs.cuda_major }} \
            --python-version ${{ matrix.python }} \
            --version ${{ inputs.version || '0.14.99' }}

      - name: Upload CUDA-Q Algorithms wheels
        uses: actions/upload-artifact@v4
        with:
          # py3-none-any: architecture-independent, built once and consumed by
          # every wheel-test leg, so the artifact name carries no platform.
          name: algorithms-wheels-py${{ matrix.python }}-cu${{ steps.config.outputs.cuda_major }}
          path: /wheels/**
          retention-days: 14
          if-no-files-found: error

  build-metapackages:
    name: Build CUDA-Q Algorithms metapackages
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install requirements
        shell: bash
        run: |
          apt update
          apt install -y --no-install-recommends ca-certificates
          python3 -m pip install --upgrade pip
          python3 -m pip install build

      - name: Build CUDA-Q Algorithms metapackages
        shell: bash
        run: |
          bash scripts/ci/build_metapackages.sh ${{ inputs.version || '0.14.99' }}
          mkdir -p /metapackages
          mv python/metapackages/dist/* /metapackages/

      - name: Upload metapackages
        uses: actions/upload-artifact@v4
        with:
          name: metapackages
          path: /metapackages/**
          retention-days: 14
          if-no-files-found: error

  test-wheels:
    name: Test CUDA-Q Algorithms wheels (${{ matrix.platform }}, ${{ matrix.device }})
    needs: [build-cudaq-wheels, build-algorithms-wheels, build-metapackages]
    # Consumes the from-source CUDA-Q wheels, so it can only run where
    # build-cudaq-wheels ran (skipped on forks along with it).
    if: ${{ !failure() && !cancelled() && startsWith(github.repository, 'NVIDIA/cudaq-algorithms') }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container_image }}
      options: ${{ matrix.container_options }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each leg is fully specified: the device only changes the runner and
        # the simulator, never the artifacts (the cuda-quantum-cuNN wheel
        # carries both the qpp-cpu and nvidia simulators).
        include:
          # CPU legs: CPU statevector (qpp-cpu, fp64) on the standard runners.
          - platform: amd64
            device: cpu
            runner: linux-amd64-cpu4
            container_image: ubuntu:24.04
            container_options: ''
            simulator: qpp-cpu
            python: '3.12'
            cuda_version: '12.6'
          - platform: arm64
            device: cpu
            runner: linux-arm64-cpu4
            container_image: ubuntu:24.04
            container_options: ''
            simulator: qpp-cpu
            python: '3.12'
            cuda_version: '12.6'
          # GPU legs: GPU statevector in double precision (nvidia-fp64) so the
          # suite's 1e-10..1e-12 tolerances hold -- the default nvidia target
          # is fp32 and fails them by design. --gpus all exposes the host GPU
          # and driver to the container; the CUDA runtime itself arrives via
          # the cuda-quantum-cuNN pip dependencies.
          - platform: amd64
            device: gpu
            runner: linux-amd64-gpu-a100-latest-1
            container_image: ubuntu:24.04
            container_options: '--gpus all'
            simulator: nvidia-fp64
            python: '3.12'
            cuda_version: '12.6'
          # WARNING: this arm64 GPU runner label is a naming-convention guess,
          # NOT a confirmed label. Replace it with the real arm64 GPU pool
          # label (or drop this leg) before relying on it -- an unknown label
          # leaves the job queued indefinitely.
          - platform: arm64
            device: gpu
            runner: linux-arm64-gpu-a100-latest-1
            container_image: ubuntu:24.04
            container_options: '--gpus all'
            simulator: nvidia-fp64
            python: '3.12'
            cuda_version: '12.6'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Configure
        id: config
        run: |
          cuda_major=$(echo ${{ matrix.cuda_version }} | cut -d . -f1)
          echo "cuda_major=$cuda_major" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install system requirements
        run: |
          apt update
          apt install -y --no-install-recommends ca-certificates libgfortran5 unzip
          if [ "$(uname -m)" = "x86_64" ]; then
            apt install -y --no-install-recommends libquadmath0
          fi

      - name: Verify GPU is visible
        if: ${{ matrix.device == 'gpu' }}
        run: nvidia-smi

      - name: Download CUDA-Q wheels
        uses: actions/download-artifact@v4
        with:
          name: cudaq-wheels-${{ matrix.platform }}-cu${{ steps.config.outputs.cuda_major }}
          path: /cudaq-wheels

      - name: Download CUDA-Q Algorithms metapackages
        uses: actions/download-artifact@v4
        with:
          name: metapackages
          path: /metapackages

      - name: Download CUDA-Q Algorithms wheels
        uses: actions/download-artifact@v4
        with:
          # Architecture-independent wheel, built once (see build-algorithms-wheels).
          name: algorithms-wheels-py${{ matrix.python }}-cu${{ steps.config.outputs.cuda_major }}
          path: /wheels

      - name: Test wheels
        env:
          CUDAQ_DEFAULT_SIMULATOR: ${{ matrix.simulator }}
        run: |
          ls -la /cudaq-wheels /metapackages /wheels
          bash scripts/ci/test_wheels.sh \
            ${{ matrix.python }} \
            ${{ matrix.platform }} \
            ${{ matrix.cuda_version }} \
            0.14.99 \
            ${{ inputs.version || '0.14.99' }}
