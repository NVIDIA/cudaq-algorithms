name: Algorithms wheels

on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: Version number to create wheels with.
        default: 0.15.99
        required: false
      cudaq_wheels:
        type: choice
        required: true
        description: 'CUDA-Q wheel source: Custom = built from the pinned .cudaq_version commit (unreleased); PyPI = released cuda-quantum wheels from the public indices (resolves against released cuda-quantum >= 0.15.0).'
        default: 'Custom'
        options:
          - 'Custom'
          - 'PyPI'
      cache_key_suffix:
        type: string
        description: Optional suffix to append to CUDA-Q wheel cache keys.
        default: ''
        required: false
      cudaq_repo:
        type: string
        description: Optional CUDA-Q repository override.
        default: ''
        required: false
      cudaq_ref:
        type: string
        description: Optional CUDA-Q ref override.
        default: ''
        required: false
  workflow_call:
    inputs:
      version:
        type: string
        default: 0.15.99
        required: false
      cudaq_wheels:
        type: string
        default: 'Custom'
        required: false
      cache_key_suffix:
        type: string
        default: ''
        required: false
      cudaq_repo:
        type: string
        default: ''
        required: false
      cudaq_ref:
        type: string
        default: ''
        required: false
    secrets:
      CUDAQ_ACCESS_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-build-wheels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-cudaq-wheels:
    name: Build CUDA-Q wheels
    # Building CUDA-Q from source needs the large self-hosted runners;
    # forks skip it (and the test job below) and still get the pure algorithms
    # wheel artifact. It is also skipped in PyPI mode, where the test installs a
    # released CUDA-Q via the cudaq dependency instead of a from-source
    # (unreleased) build.
    if: ${{ startsWith(github.repository, 'NVIDIA/cudaq-algorithms') && inputs.cudaq_wheels == 'Custom' }}
    uses: ./.github/workflows/build_cudaq_wheels.yaml
    permissions:
      actions: write
      contents: read
      pull-requests: read
    with:
      cache_key_suffix: ${{ inputs.cache_key_suffix }}
      cudaq_repo: ${{ inputs.cudaq_repo }}
      cudaq_ref: ${{ inputs.cudaq_ref }}
      save_build: true
      upload_artifact: true
    secrets:
      CUDAQ_ACCESS_TOKEN: ${{ secrets.CUDAQ_ACCESS_TOKEN }}

  build-algorithms-wheels:
    name: Build CUDA-Q Algorithms wheels
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12']
        platform: ['amd64']
    # The wheel is py3-none-any, so this job has no architecture axis. The
    # runner is hardcoded (rather than a platform-matrix'd label) so the job
    # structurally cannot grow a second arch leg that would upload to the same
    # arch-neutral artifact name -- upload-artifact@v4 rejects duplicate names
    # within a run.
    runs-on: ${{ startsWith(github.repository, 'NVIDIA/cudaq-algorithms') && 'linux-amd64-cpu8' || 'ubuntu-latest' }}
    # The wheels are pure Python (py3-none-any): no CUDA-Q toolchain, no
    # manylinux devdeps image — a stock python container is enough.
    container: python:${{ matrix.python }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Build CUDA-Q Algorithms wheels
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash scripts/ci/build_wheels.sh \
            --python-version ${{ matrix.python }} \
            --version ${{ inputs.version || '0.15.99' }}

      - name: Upload CUDA-Q Algorithms wheels
        uses: actions/upload-artifact@v4
        with:
          # py3-none-any: architecture-independent, built once and consumed by
          # every test leg, so the name carries no platform or CUDA tag.
          name: algorithms-wheels-py${{ matrix.python }}
          path: /wheels/**
          retention-days: 14
          if-no-files-found: error

  test-wheels:
    name: Test CUDA-Q Algorithms wheels (${{ matrix.platform }}, ${{ matrix.device }})
    needs: [build-cudaq-wheels, build-algorithms-wheels]
    # In Custom mode this consumes the from-source CUDA-Q wheels from
    # build-cudaq-wheels, so both are skipped together on forks. In PyPI mode
    # build-cudaq-wheels is skipped and this leg instead installs a released
    # CUDA-Q; the !failure() && !cancelled() guard (deliberately not success())
    # is what lets it run when that upstream job was skipped.
    if: ${{ !failure() && !cancelled() && startsWith(github.repository, 'NVIDIA/cudaq-algorithms') }}
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.container_image }}
      options: ${{ matrix.container_options }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Each leg is fully specified. device selects the runner, container and
        # simulator and -- as the legs are pinned -- the CUDA major
        # (cpu -> cu12, gpu -> cu13). The cuda-quantum-cuNN wheel carries both
        # the qpp-cpu and nvidia simulators; this smoke matrix deliberately
        # exercises cu12 with qpp-cpu and cu13 with nvidia-fp64, not the cross
        # pairings.
        include:
          # CPU legs: CPU statevector (qpp-cpu, fp64) on the standard runners.
          - platform: amd64
            device: cpu
            runner: linux-amd64-cpu4
            container_image: ubuntu:24.04
            container_options: ''
            simulator: qpp-cpu
            python: '3.12'
            cuda_version: '12.6'
          - platform: arm64
            device: cpu
            runner: linux-arm64-cpu4
            container_image: ubuntu:24.04
            container_options: ''
            simulator: qpp-cpu
            python: '3.12'
            cuda_version: '12.6'
          # GPU legs install the same wheel but run it in the CUDA-Q
          # devcontainer (the image cudaqx uses for GPU jobs) rather than bare
          # ubuntu: it ships the CUDA toolkit, which the optional CuPy
          # acceleration in double_factorization needs to find a CUDA root --
          # bare ubuntu has only the driver (via --gpus all), so CuPy fails to
          # auto-detect CUDA. GPU statevector runs in double precision
          # (nvidia-fp64); the default nvidia target is fp32 and fails the
          # suite's 1e-10..1e-12 tolerances by design. GPU runners are CUDA 13
          # hosts, so these legs install the cu13 cuda-quantum (from source in
          # Custom mode, or resolved via cudaq in PyPI mode).
          - platform: amd64
            device: gpu
            runner: linux-amd64-gpu-a100-latest-1
            container_image: ghcr.io/nvidia/cuda-quantum-devcontainer:amd64-cu13.0-gcc12-main
            container_options: '--gpus all'
            simulator: nvidia-fp64
            python: '3.12'
            cuda_version: '13.0'
          # arm64 GPU pool: this label was validated to schedule and expose a
          # GPU in run 30325140657 (the Verify-GPU step passed).
          - platform: arm64
            device: gpu
            runner: linux-arm64-gpu-a100-latest-1
            container_image: ghcr.io/nvidia/cuda-quantum-devcontainer:arm64-cu13.0-gcc12-main
            container_options: '--gpus all'
            simulator: nvidia-fp64
            python: '3.12'
            cuda_version: '13.0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Configure
        id: config
        run: |
          cuda_major=$(echo ${{ matrix.cuda_version }} | cut -d . -f1)
          echo "cuda_major=$cuda_major" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install system requirements
        run: |
          apt update
          apt install -y --no-install-recommends ca-certificates libgfortran5 unzip
          if [ "$(uname -m)" = "x86_64" ]; then
            apt install -y --no-install-recommends libquadmath0
          fi

      - name: Verify GPU is visible
        if: ${{ matrix.device == 'gpu' }}
        run: nvidia-smi

      - name: Download CUDA-Q wheels
        # Only built in Custom mode; PyPI mode installs a released CUDA-Q via
        # the cudaq dependency instead.
        if: ${{ inputs.cudaq_wheels == 'Custom' }}
        uses: actions/download-artifact@v4
        with:
          name: cudaq-wheels-${{ matrix.platform }}-cu${{ steps.config.outputs.cuda_major }}
          path: /cudaq-wheels

      - name: Download CUDA-Q Algorithms wheels
        uses: actions/download-artifact@v4
        with:
          # Architecture-independent wheel, built once (see build-algorithms-wheels).
          name: algorithms-wheels-py${{ matrix.python }}
          path: /wheels

      - name: Test wheels
        env:
          CUDAQ_DEFAULT_SIMULATOR: ${{ matrix.simulator }}
        run: |
          ls -la /wheels
          ls -la /cudaq-wheels 2>/dev/null || true
          bash scripts/ci/test_wheels.sh \
            ${{ matrix.python }} \
            ${{ matrix.platform }} \
            ${{ matrix.cuda_version }} \
            ${{ inputs.cudaq_wheels == 'Custom' && '0.15.99' || 'SKIP' }} \
            ${{ inputs.version || '0.15.99' }} \
            ${{ matrix.device }}
