name: Algorithms lib

on:
  workflow_dispatch:
    inputs:
      cudaq_source:
        type: choice
        description: >
          cudaq to test against: pip = the released cudaq the wheel
          declares support for; source = build the pinned .cudaq_version
          from source (forward-compatibility probing).
        options:
          - pip
          - source
        default: pip
        required: false
      cache_key_suffix:
        type: string
        description: Optional suffix to append to CUDA-Q cache keys.
        default: ''
        required: false
      cudaq_repo:
        type: string
        description: Optional CUDA-Q repository override.
        default: ''
        required: false
      cudaq_ref:
        type: string
        description: Optional CUDA-Q ref override.
        default: ''
        required: false
  workflow_call:
    inputs:
      cudaq_source:
        type: string
        default: pip
        required: false
      cache_key_suffix:
        type: string
        default: ''
        required: false
      cudaq_repo:
        type: string
        default: ''
        required: false
      cudaq_ref:
        type: string
        default: ''
        required: false
    secrets:
      CUDAQ_ACCESS_TOKEN:
        required: false

concurrency:
  group: ${{ github.workflow }}-build-algorithms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    strategy:
      fail-fast: false
      matrix:
        platform: ['amd64', 'arm64']
        cuda_version: ['12.6', '13.0']
    runs-on: ${{ startsWith(github.repository, 'NVIDIA/cudaq-algorithms') && format('linux-{0}-cpu8', matrix.platform) || 'ubuntu-latest' }}
    container: ghcr.io/nvidia/cuda-quantum-devcontainer:${{ matrix.platform }}-cu${{ matrix.cuda_version }}-gcc12-main
    permissions:
      actions: write
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - name: Configure
        id: config
        run: |
          cuda_major=$(echo ${{ matrix.cuda_version }} | cut -d . -f1)
          cache_key_suffix="${{ inputs.cache_key_suffix }}"
          if [[ -z "$cache_key_suffix" && "${{ github.event_name }}" == "pull_request" ]]; then
            cache_key_suffix="pr${{ github.event.pull_request.number }}"
          fi
          echo "cuda_major=$cuda_major" >> "$GITHUB_OUTPUT"
          echo "cache_key_suffix=$cache_key_suffix" >> "$GITHUB_OUTPUT"

      # ========================================================================
      # CUDA Quantum build
      # ========================================================================

      - name: Get required CUDAQ version
        if: inputs.cudaq_source == 'source'
        id: get-cudaq-version
        uses: ./.github/actions/get-cudaq-version
        with:
          repo: ${{ inputs.cudaq_repo }}
          ref: ${{ inputs.cudaq_ref }}

      - name: Get CUDAQ build
        if: inputs.cudaq_source == 'source'
        uses: ./.github/actions/get-cudaq-build
        with:
          repo: ${{ steps.get-cudaq-version.outputs.repo }}
          ref: ${{ steps.get-cudaq-version.outputs.ref }}
          token: ${{ secrets.CUDAQ_ACCESS_TOKEN }}
          cache-key-suffix: ${{ steps.config.outputs.cache_key_suffix }}
          save-build: true
          save-ccache: false
          platform: ${{ matrix.platform }}-cu${{ steps.config.outputs.cuda_major }}

      # ========================================================================
      # Build CUDA-Q Algorithms
      # ========================================================================

      - name: Install test requirements
        run: |
          python3 -m pip install numpy scipy pytest pyscf qsppack

      - name: Install released cudaq
        if: inputs.cudaq_source == 'pip'
        # The range mirrors pyproject's declared dependency; patch
        # releases inside it are tested automatically. The cudaq
        # resolver picks its own cuda-quantum-cuNN on these CPU-only
        # runners (see scripts/ci/test_wheels.sh for why the variant is
        # the resolver's business, not ours).
        run: |
          python3 -m pip install "cudaq>=0.15.0,<0.16"

      - name: Run tests
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [[ "${{ inputs.cudaq_source }}" == "source" ]]; then
            export PATH=/cudaq-install/bin:$PATH
            export LD_LIBRARY_PATH=/cudaq-install/lib:${LD_LIBRARY_PATH:-}
            bash scripts/test_algorithms_build.sh --cudaq-prefix /cudaq-install
          else
            bash scripts/test_algorithms_build.sh --pip-cudaq
          fi
