[project]
name = "cudaq-algorithms"
dynamic = ["version", "dependencies", "optional-dependencies"]
keywords = ["cudaq", "cuda-quantum", "cuda", "quantum", "quantum computing", "nvidia"]
description = "Reusable quantum algorithm primitives built on CUDA-Q"
authors = [{name = "NVIDIA Corporation & Affiliates"}]
maintainers = [{name = "NVIDIA Corporation & Affiliates"}]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Environment :: GPU :: NVIDIA CUDA",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Environment :: GPU :: NVIDIA CUDA :: 13",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/NVIDIA/cudaq-algorithms"
Documentation = "https://github.com/NVIDIA/cudaq-algorithms"
Repository = "https://github.com/NVIDIA/cudaq-algorithms"

[build-system]
requires = ["setuptools", "nvidia-ml-py"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []
include-package-data = true

[tool.setuptools.dynamic]
version = {file = "_version.txt"}
